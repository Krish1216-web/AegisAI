name: AegisAI Continuous Integration

'on':
  push:
    branches:
      - main
      - phase-11-deployment
  pull_request:
    branches:
      - main
      - phase-11-deployment

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff black flake8 pytest pytest-asyncio pytest-cov httpx

      - name: Run Code Formatting & Lint Validation
        run: |
          ruff check backend/
          black --check backend/

      - name: Validate Alembic Migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aegisai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head
          alembic check

      - name: Run Backend Pytest Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aegisai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_pipeline_32_chars_long
        run: |
          cd backend
          pytest tests/unit/ -v --junitxml=pytest-results.xml --cov=app --cov-report=xml

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/pytest-results.xml
          retention-days: 14

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  frontend-ci:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Dependency Vulnerability Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Frontend Linters
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Assets
        working-directory: frontend
        run: |
          test -d dist || { echo "dist directory missing"; exit 1; }
          test -f dist/index.html || { echo "index.html missing"; exit 1; }

  security-and-secrets:
    name: Security & Secret Scanning Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --exclude-paths=.github/trufflehog-ignore.txt
        continue-on-error: false

      - name: Set up Python 3.12 for Security Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Dependency Vulnerability Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --format json --output backend-audit.json || {
            echo "Critical Python dependency vulnerabilities detected!"
            exit 1
          }

      - name: Run Static Security Analysis (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app -ll -ii -f json -o bandit-report.json

      - name: Upload Security Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-security-reports
          path: |
            backend-audit.json
            bandit-report.json
          retention-days: 30

      - name: Run Phase 10 Dedicated Security Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_security_suite_32chars
        run: |
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx
          cd backend
          pytest tests/unit/test_phase10_*.py -v

  docker-build-and-scan:
    name: Container Build, SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Immutable Tag)
        run: |
          docker build \
            --load \
            -f docker/production/app.dockerfile \
            -t aegisai-backend:${{ github.sha }} \
            -t aegisai-backend:ci .

      - name: Build Frontend Image (Immutable Tag)
        run: |
          docker build \
            --load \
            -f docker/production/frontend.dockerfile \
            -t aegisai-frontend:${{ github.sha }} \
            -t aegisai-frontend:ci .

      - name: Build Worker Image (Immutable Tag)
        run: |
          docker build \
            --load \
            -f docker/production/worker.dockerfile \
            -t aegisai-worker:${{ github.sha }} \
            -t aegisai-worker:ci .

      - name: Generate Backend Image SBOM (Syft / SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: aegisai-backend:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'sbom-backend.spdx.json'

      - name: Generate Frontend Image SBOM (Syft / SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: aegisai-frontend:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'sbom-frontend.spdx.json'

      - name: Generate Worker Image SBOM (Syft / SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: aegisai-worker:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'sbom-worker.spdx.json'

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-sboms
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
            sbom-worker.spdx.json
          retention-days: 30

      - name: Scan Backend Image for Critical Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aegisai-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image for Critical Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aegisai-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Worker Image for Critical Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aegisai-worker:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
