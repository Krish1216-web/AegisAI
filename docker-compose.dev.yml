# ==============================================================================
# AegisAI Enterprise — Development Docker Compose Stack
# Local debugging with exposed database/redis ports and hot-reloading
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/development/app.dockerfile
    image: aegisai-backend:dev
    container_name: aegisai-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aegisai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=SUPER_SECRET_AEGIS_KEY_2026_CHANGE_ME
      - DOCUMENT_STORAGE_PATH=/workspace/storage
    volumes:
      - ./backend:/workspace
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: aegisai-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegisai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegisai-redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
